# Default experiment configuration
# Override any key with environment variables prefixed by IAP_
# Example: IAP_SAMPLE_SIZE=1000

app_env: development
debug: true
log_level: INFO
random_seed: 42

dataset_dir: dataset
annotation_file: dataset/annotations/captions_val2017.json
image_dir: dataset/val2017
models_dir: models
results_dir: results
log_dir: results/logs
embeddings_dir: results/embeddings

experiment_name: image_ambiguity_baseline
sample_size: 4000
train_ratio: 0.7
val_ratio: 0.15
test_ratio: 0.15

api_host: 127.0.0.1
api_port: 8000
api_reload: true
cors_origins:
  - http://localhost:5173

sentence_model_name: sentence-transformers/all-MiniLM-L6-v2
device: auto
embedding_batch_size: 32

# Visual simplicity gate — selects stable vs diverse BLIP only.
# Does NOT hardcode Low/Medium/High or change label thresholds.
visual_gate_enabled: true
visual_gate_edge_density_max: 0.040
visual_gate_entropy_max: 7.25
visual_gate_texture_max: 900.0
visual_gate_contrast_max: 55.0
visual_gate_color_variance_max: 3200.0
visual_gate_brightness_min: 165.0   # set null to disable brightness vote
visual_gate_min_simple_votes: 3
visual_gate_min_vote_fraction: 0.5

# BLIP generation / clustering for inference
blip_stable_num_beams: 5
blip_stable_num_return_sequences: 3
blip_stable_max_length: 40
blip_stable_use_mild_prompts: true
blip_diverse_num_return_sequences: 4
blip_diverse_temperature: 1.35
blip_diverse_top_p: 0.85
blip_diverse_top_k: 60
blip_cluster_similarity_threshold: 0.85
blip_cluster_when_simple: true
blip_cluster_when_complex: false
